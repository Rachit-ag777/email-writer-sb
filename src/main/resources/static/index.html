<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Mail Sender</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            max-width: 600px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .buttons {
            margin-top: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            margin-right: 10px;
            cursor: pointer;
        }
        .status {
            margin-top: 10px;
            font-weight: bold;
        }
        .footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #ccc;
            text-align: center;
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Cold Mail Sender</h1>

    <div class="form-group">
        <label for="toEmail">Recipient Email:</label>
        <input type="email" id="toEmail" placeholder="recipient@example.com">
    </div>

    <div class="form-group">
        <label for="subject">Subject:</label>
        <input type="text" id="subject" placeholder="Email Subject">
    </div>

    <div class="form-group">
        <label for="emailContent">Original Email Content:</label>
        <textarea id="emailContent" rows="6" placeholder="Paste the original email content here..."></textarea>
    </div>

    <div class="form-group">
        <label for="tone">Tone:</label>
        <select id="tone">
            <option value="">None</option>
            <option value="professional">Professional</option>
            <option value="casual">Casual</option>
            <option value="friendly">Friendly</option>
        </select>
    </div>

    <div class="buttons">
        <button id="generateBtn" onclick="generateReply()">Generate Reply</button>
    </div>

    <div class="form-group">
        <label for="generatedReply">Generated Reply:</label>
        <textarea id="generatedReply" rows="6" placeholder="The generated reply will appear here..."></textarea>
    </div>

    <div class="buttons">
        <button id="mailtoBtn" onclick="sendMailTo()">Send Email</button>
    </div>

    <div id="statusMessage" class="status"></div>

    <script>
        async function generateReply() {
            const emailContent = document.getElementById('emailContent').value;
            const tone = document.getElementById('tone').value;
            const statusDiv = document.getElementById('statusMessage');
            const generateBtn = document.getElementById('generateBtn');

            if (!emailContent) {
                alert('Please enter the original email content.');
                return;
            }

            statusDiv.innerText = 'Generating reply...';
            generateBtn.disabled = true;

            try {
                const response = await fetch('/api/email/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ emailContent, tone })
                });

                if (response.ok) {
                    const text = await response.text();
                    document.getElementById('generatedReply').value = text;
                    statusDiv.innerText = 'Reply generated successfully.';
                } else {
                    const err = await response.text();
                    statusDiv.innerText = 'Error generating reply: ' + err;
                }
            } catch (e) {
                statusDiv.innerText = 'Network error: ' + e.message;
            } finally {
                generateBtn.disabled = false;
            }
        }



        function sendMailTo() {
            const to = document.getElementById('toEmail').value;
            const subject = document.getElementById('subject').value;
            const body = document.getElementById('generatedReply').value;

            if (!to || !subject || !body) {
                alert('Please fill in Recipient, Subject, and Generated Reply before sending.');
                return;
            }

            const mailtoUrl = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailtoUrl;
        }
    </script>
    <div class="footer">
        made by Rachit Agarwal
    </div>
</body>
</html>
